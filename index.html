<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>倒水手感小样</title>
<style>
html,body{margin:0;height:100%;background:#1b2130;color:#eef1f7;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;font-size:15px;pointer-events:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,17,25,.9)}
#overlay.hide{display:none}
.card{max-width:320px;padding:24px;text-align:center;line-height:1.7;font-size:15px}
.card h2{margin:0 0 8px;font-size:22px}
.card p{margin:6px 0}
.small{opacity:.7;font-size:13px}
button{font:inherit;font-size:17px;padding:11px 26px;border:0;border-radius:24px;background:#f2a541;color:#1b2130;margin:10px 4px 0;font-weight:600}
button.ghost{background:transparent;color:#eef1f7;border:1px solid rgba(255,255,255,.4)}
#bar{position:fixed;left:14px;right:14px;bottom:12px;font-size:13px;display:flex;gap:8px;align-items:center;opacity:.85}
#bar input{flex:1}
#bar button{font-size:13px;padding:5px 12px;margin:0}
@media(orientation:landscape){body:after{content:"请将手机转为竖屏";position:fixed;inset:0;display:grid;place-items:center;background:#182332;z-index:9}} #actions{position:fixed;top:8%;width:100%;text-align:center} #actions button{font-size:14px;padding:7px 16px} #overlay{z-index:2}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="lv">第 1 杯</span><span id="info"></span></div>
<div id="bar">灵敏度<input id="gain" type="range" min="0.8" max="2.5" step="0.1" value="1.4"><span id="gv">1.4</span><button class="ghost" id="inv">方向反了</button></div>
<div id="actions" hidden><button id="water">水瓶</button><button id="oil">油瓶</button><button id="check" class="ghost">验收</button></div><div id="overlay"><div class="card" id="card"></div></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,s,B,G,A0;
let state='intro';              // intro | calib | ready | play | result
let level=1,target=0.5,tol=0.08;
let vb=0.72,poured=0,spilled=0,parts=[],lastFlow=0,flowFrac=0;
let theta=0,sm=0,alpha=0.2,sigma=0,dead=0.4;
let gain=1.4,dir=1;
let haveMotion=false,haveOri=false,motionAng=0,oriAng=0,base=0,useDrag=false,dragAng=0;
let calibSamples=[],calibStart=0;

const wrap=a=>{while(a>180)a-=360;while(a<=-180)a+=360;return a;};

/* ---------- 传感器 ---------- */
function onMotion(e){const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;if(Math.hypot(g.x,g.y)<2)return;motionAng=-Math.atan2(g.x,g.y)*180/Math.PI;haveMotion=true;}
function onOri(e){if(e.gamma==null)return;oriAng=e.gamma;haveOri=true;}
function diag(){return '浏览器支持:'+(window.DeviceOrientationEvent?'是':'否')+' 安全连接:'+(window.isSecureContext?'是':'否')+' 权限:'+(window.__perm||'未弹窗')+(/MicroMessenger/i.test(navigator.userAgent)?' (在微信里)':'');}
function rawAng(){return haveMotion?motionAng:oriAng;}
function enableSensors(){
  const asks=[];
  try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)asks.push(DeviceMotionEvent.requestPermission().catch(()=>{}));}catch(e){}
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)asks.push(DeviceOrientationEvent.requestPermission().then(r=>{window.__perm=r;}).catch(e=>{window.__perm='出错';}));}catch(e){window.__perm='出错';}
  addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOri);
  return Promise.all(asks);
}

/* ---------- 手指拖动(没有传感器时) ---------- */
let lastX=null;
cv.addEventListener('pointerdown',e=>{lastX=e.clientX;});
cv.addEventListener('pointermove',e=>{if(lastX==null||!useDrag)return;dragAng=Math.max(-40,Math.min(150,dragAng+(e.clientX-lastX)*0.6));lastX=e.clientX;});
addEventListener('pointerup',()=>{lastX=null;});

$('gain').oninput=e=>{gain=+e.target.value;$('gv').textContent=gain.toFixed(1);};
$('inv').onclick=()=>{dir=-dir;};

/* ---------- 声音:倒水声,越满音调越高 ---------- */
let actx,ng,filt;
function initAudio(){
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    const len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    filt=actx.createBiquadFilter();filt.type='bandpass';filt.Q.value=5;filt.frequency.value=400;
    ng=actx.createGain();ng.gain.value=0;src.connect(filt);filt.connect(ng);ng.connect(actx.destination);src.start();
  }catch(e){actx=null;}
}
function ding(ok){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=ok?880:220;o.type=ok?'sine':'triangle';g.gain.setValueAtTime(0.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.5);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.5);}catch(e){}}

/* ---------- 流程 ---------- */
function show(html){$('card').innerHTML=html;$('overlay').classList.remove('hide');}
function hide(){$('overlay').classList.add('hide');}
function intro(){
  show(`<h2>液体实验室</h2>
  <p>1. 先把手机<b>锁定竖屏</b>(不然一歪屏幕就转了)</p>
  <p>2. 手机向右倾斜,瓶子就会倒水</p>
  <p>3. 对准刻度后回正瓶子，点<b>验收</b></p>
  <p class="small">倒得越慢越好控制;快满时声音会变尖</p>
  <button id="go">开始</button>`);
  $('go').onclick=()=>{const p=enableSensors();screen.orientation?.lock?.("portrait").catch(()=>{});initAudio();show('<h2>正在打开传感器</h2><p class="small">如果弹窗,请点“允许”</p>');p.then(startCalib);};
}
function startCalib(){
  show(`<h2>请拿稳手机</h2><p>正常竖着拿,别动,大约 1 秒</p><p class="small">在测这台手机的零点和抖动</p>`);
  state='calib';calibSamples=[];calibStart=performance.now();
}
function finishCalib(){
  if(!haveMotion&&!haveOri){useDrag=true;base=0;sigma=0;alpha=0.3;}
  else{
    let sx=0,sy=0;for(const a of calibSamples){sx+=Math.cos(a*Math.PI/180);sy+=Math.sin(a*Math.PI/180);}
    base=Math.atan2(sy,sx)*180/Math.PI;
    let v=0;for(const a of calibSamples){const d=wrap(a-base);v+=d*d;}
    sigma=calibSamples.length?Math.sqrt(v/calibSamples.length):0;
    alpha=Math.max(0.06,Math.min(0.3,0.3/(1+sigma*2)));   // 抖得越厉害,平滑越重
    dead=Math.min(1.5,0.3+sigma);
  }
  sm=0;newCup(true);
}
const spacing=5, step=1/120, cup={left:76,right:320,top:354,bottom:466};
const capacity=(cup.right-cup.left)*(cup.bottom-cup.top)/(spacing*spacing*.866);
const outline=[[-13,0],[-13,14],[-45,30],[-45,155],[45,155],[45,30],[13,14],[13,0]];
const palette=['#86d7ff','#ffd276'];
let drops=[],angles=[0,0],active=0,counts=[0,0],means=[0,0],flow=0,acc=0,previous=performance.now();
function pivot(k){return level===1?184:120+k*128}
function choose(k){active=k;dragAng=sm=0;for(const [i,id] of ['water','oil'].entries())$(id).style.opacity=k===i?'1':'.55'}
$('water').onclick=()=>choose(0);$('oil').onclick=()=>choose(1);
function newCup(){
  drops=[];angles=[0,0];counts=[0,0];choose(0);target=level===1?.32:.25;tol=.06;
  for(let k=0;k<level;k++)for(let row=0;row<26;row++)for(let col=0;col<17;col++){
    drops.push({x:pivot(k)-41+col*spacing+(row%2)*2.5,y:160+152-row*4.33,vx:0,vy:0,k,inside:k});
  }
  $('lv').textContent='液体实验室　/　0'+level;$('actions').hidden=false;$('oil').hidden=level===1;
  state='ready';show('<h2>第 '+level+' 关</h2><p>'+goal()+'</p><p>'+ (useDrag?'左右拖动瓶身调节倾角。':'向右倾斜手机倒液。')+'回正后点验收。</p><button id="ok">开始倒液</button>');
  $('ok').onclick=()=>{hide();state='play'};
}
function goal(){return level===1?'水 32% ±6%':'先水 25%，再油 20%，各允许 ±6%'}
$('check').onclick=()=>{
  const ok=Math.abs(counts[0]/capacity-target)<=tol&&(level===1||(Math.abs(counts[1]/capacity-.2)<=tol&&means[1]<means[0]));
  state='result';ding(ok);show('<h2>'+(ok?'过关！':'还差一点')+'</h2><p>'+goal()+'</p><p>'+$('info').textContent+'</p><button id="retry">重新倒</button><button id="continue">'+(ok?(level===1?'下一关':'再玩一次'):'继续调整')+'</button>');
  $('retry').onclick=newCup;$('continue').onclick=()=>{if(ok){level=3-level;newCup()}else{hide();state='play'}};
};
// Project onto the inward half-plane of each nearby wall segment.
function wall(p,x,y,X,Y){
  const dx=X-x,dy=Y-y,len=Math.hypot(dx,dy),nx=dy/len,ny=-dx/len;
  const along=((p.x-x)*dx+(p.y-y)*dy)/len;
  if(along< -2||along>len+2)return;
  const d=(p.x-x)*nx+(p.y-y)*ny;
  if(d<2&&d> -10){p.x+=(2-d)*nx;p.y+=(2-d)*ny}
}
function simulate(){
 const walls=[];
 for(let k=0;k<level;k++){
   const desired=k===active?theta*Math.PI/180:0;
   angles[k]+=Math.max(-.025,Math.min(.025,desired-angles[k]));
   const c=Math.cos(angles[k]),s=Math.sin(angles[k]);
   walls[k]=outline.map(([x,y])=>[pivot(k)+x*c-y*s,160+x*s+y*c]);
 }
 const grid=new Map(),h=7;
 for(const p of drops){
   p.ox=p.x;p.oy=p.y;p.vy+=650*step;p.x+=p.vx*step;p.y+=p.vy*step;
   const key=Math.floor(p.x/h)+512*Math.floor(p.y/h);
   if(!grid.has(key))grid.set(key,[]);grid.get(key).push(p);
 }
 // Position-based short-range pressure, mass-weighted projection and pair viscosity.
 for(const p of drops){
  const cell=Math.floor(p.x/h)+512*Math.floor(p.y/h);
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
   const bucket=grid.get(cell+i+j*512);if(!bucket)continue;
   for(const q of bucket){
    if(q.ox<p.ox||(q.ox===p.ox&&q.oy<=p.oy)||q.inside!==p.inside)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
    if(d>=h||d<.001)continue;
    const mass=p.k?.78:1,other=q.k?.78:1,share=other/(mass+other);
    const push=Math.max(0,(p.k===q.k?5:5.4)-d)*.85/d;
    const visc=(p.k&&q.k?.24:.065)*(1-d/h)*step;
    const sx=dx*push-(q.vx-p.vx)*visc,sy=dy*push-(q.vy-p.vy)*visc;
    p.x-=sx*share;p.y-=sy*share;q.x+=sx*(1-share);q.y+=sy*(1-share);
   }
  }
 }
 counts=[0,0];means=[0,0];flow*=.98;
 for(const p of drops){
  if(p.inside>=0){
   const k=p.inside,poly=walls[k];for(let i=1;i<poly.length;i++)wall(p,...poly[i-1],...poly[i]);
   if(-(p.x-pivot(k))*Math.sin(angles[k])+(p.y-160)*Math.cos(angles[k])<0){p.inside=-1;flow++}
  }else{
   const {left:l,right:r,top:t,bottom:b}=cup;
   if(p.ox>=l&&p.ox<=r||p.oy<t){wall(p,l,t,l,b);wall(p,r,b,r,t)}
   if(p.oy<=b)wall(p,l,b,r,b);
   if(p.x>=l&&p.x<=r&&p.y>=t&&p.y<=b){counts[p.k]++;means[p.k]+=p.y}
  }
  p.vx=Math.max(-360,Math.min(360,(p.x-p.ox)/step))*.998;p.vy=Math.max(-420,Math.min(420,(p.y-p.oy)/step))*.999;
 }
 drops=drops.filter(p=>p.y<570);means=means.map((n,k)=>n/(counts[k]||1));
}
const layer=document.createElement('canvas');layer.width=195;layer.height=260;
const ink=layer.getContext('2d',{willReadFrequently:true});
function draw(){
 const scale=Math.min(innerWidth/390,innerHeight*.78/520),dpr=Math.min(devicePixelRatio,2);
 if(cv.width!==Math.round(innerWidth*dpr)||cv.height!==Math.round(innerHeight*dpr)){cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
 ctx.save();ctx.translate((innerWidth-390*scale)/2,(innerHeight-520*scale)/2);ctx.scale(scale,scale);
 for(let k=0;k<level;k++){
  ink.clearRect(0,0,195,260);ink.fillStyle=palette[k];ink.beginPath();
  for(const p of drops)if(p.k===k){ink.moveTo(p.x/2+1.9,p.y/2);ink.arc(p.x/2,p.y/2,1.9,0,2*Math.PI)}
  ink.fill();const img=ink.getImageData(0,0,195,260),data=img.data;
  for(let i=data.length-1;i>=0;i-=4){const a=data[i];if(a<80)data[i]=0;else{data[i]=190;if(i>=780&&data[i-780]<80){data[i-3]=224;data[i-2]=241}}}
  ink.putImageData(img,0,0);ctx.drawImage(layer,0,0,390,520);
 }
 ctx.lineWidth=2;ctx.lineJoin='round';
 for(let k=0;k<level;k++){ctx.save();ctx.translate(pivot(k),160);ctx.rotate(angles[k]);ctx.strokeStyle=palette[k];ctx.beginPath();outline.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.restore()}
 ctx.strokeStyle='#c1d5df';ctx.beginPath();ctx.moveTo(76,354);ctx.lineTo(76,466);ctx.lineTo(320,466);ctx.lineTo(320,354);ctx.stroke();
 for(const [fraction,label] of (level===1?[[.32,'水 32%']]:[[.25,'水 25%'],[.45,'总量 45%']])){const y=466-112*fraction;ctx.fillStyle=ctx.strokeStyle='#e4edf4';ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(76,y);ctx.lineTo(320,y);ctx.stroke();ctx.font='11px sans-serif';ctx.fillText(label,12,y+4)}
 ctx.restore();ctx.fillStyle='#9caab9';ctx.font='11px sans-serif';ctx.fillText('倾斜 '+theta.toFixed(0)+'°　抖动 '+sigma.toFixed(2)+'°　'+(useDrag?'手指模式':'传感器'),14,innerHeight-47);
 $('info').textContent=counts.slice(0,level).map((n,i)=>(i?'油 ':'水 ')+Math.round(n/capacity*100)+'%').join('　');
}
function loop(now){
 const dt=Math.min(.033,(now-previous)/1000);previous=now;
 if(state==='calib'){if(haveMotion||haveOri)calibSamples.push(rawAng());if(now-calibStart>1100&&(calibSamples.length>5||now-calibStart>4000))finishCalib()}
 if(state==='play'&&innerWidth<=innerHeight){
 const tgt=(useDrag?dragAng:wrap(rawAng()-base))*dir;if(Math.abs(tgt-sm)>dead)sm+=(tgt-sm)*(useDrag?.35:alpha);
 theta=Math.max(-40,Math.min(150,sm*gain));acc+=dt;while(acc>=step){simulate();acc-=step}
 }
 if(ng){ng.gain.setTargetAtTime(state==='play'?Math.min(.18,flow*.005):0,actx.currentTime,.06);filt.frequency.value=400+1000*(counts[0]+counts[1])/capacity}
 if(state==='play'||state==='ready')draw();requestAnimationFrame(loop)
}
intro();requestAnimationFrame(loop);
})();
</script></body></html>
