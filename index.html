<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>倒水手感小样</title>
<style>
html,body{margin:0;height:100%;background:#1b2130;color:#eef1f7;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;font-size:15px;pointer-events:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,17,25,.9)}
#overlay.hide{display:none}
.card{max-width:320px;padding:24px;text-align:center;line-height:1.7;font-size:15px}
.card h2{margin:0 0 8px;font-size:22px}
.card p{margin:6px 0}
.small{opacity:.7;font-size:13px}
button{font:inherit;font-size:17px;padding:11px 26px;border:0;border-radius:24px;background:#f2a541;color:#1b2130;margin:10px 4px 0;font-weight:600}
button.ghost{background:transparent;color:#eef1f7;border:1px solid rgba(255,255,255,.4)}
#bar{position:fixed;left:14px;right:14px;bottom:12px;font-size:13px;display:flex;gap:8px;align-items:center;opacity:.85}
#bar input{flex:1}
#bar button{font-size:13px;padding:5px 12px;margin:0}
@media(orientation:landscape){body:after{content:"请将手机转为竖屏";position:fixed;inset:0;display:grid;place-items:center;background:#182332;z-index:9}} #actions{position:fixed;top:8%;width:100%;text-align:center} #actions button{font-size:14px;padding:7px 16px} #overlay{z-index:2}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="lv">第 1 杯</span><span id="info"></span></div>
<div id="bar">灵敏度<input id="gain" type="range" min="0.8" max="2.5" step="0.1" value="1.4"><span id="gv">1.4</span><button class="ghost" id="inv">方向反了</button></div>
<div id="actions" hidden><button id="water">水瓶</button><button id="oil">油瓶</button><button id="check" class="ghost">验收</button></div><div id="overlay"><div class="card" id="card"></div></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const wrap = a => ((a + 540) % 360 + 360) % 360 - 180;
let state = 'intro', level = 1, active = 0;
let theta = 0, sm = 0, alpha = .2, sigma = 0, dead = .4;
let gain = 1.4, direction = 1, useDrag = false, dragAngle = 0;
let haveMotion = false, haveOrientation = false, motionAngle = 0, orientationAngle = 0, base = 0;
let calibration = [], calibrationStart = 0, permission = '未请求';
let gravityX = 0, gravityY = 9.81, gravityZ = 0, gravityReady = false;
let accelerationX = 0, accelerationY = 0, motionTime = 0;
let dragForceX = 0, dragForceY = 0, dragTime = 0;

// World coordinates are CSS pixels in a 390 × 520 portrait viewport.
const dt = 1 / 120, spacing = 4.5, h = 10, h2 = h * h;
const iterations = 3, particleCount = 570, maxParticles = particleCount * 2;
const cup = {left: 76, right: 320, top: 354, bottom: 466};
const wallHalfWidth = 2, particleRadius = 1.55, contactDistance = wallHalfWidth + particleRadius;
const particleArea = spacing * spacing * Math.sqrt(3) / 2;

const outline = [[-13,0],[-13,14],[-45,30],[-45,155],[45,155],[45,30],[13,14],[13,0]];

const palette = ['#86d7ff', '#ffd276'];
const x = new Float32Array(maxParticles), y = new Float32Array(maxParticles);
const oldX = new Float32Array(maxParticles), oldY = new Float32Array(maxParticles);
const vx = new Float32Array(maxParticles), vy = new Float32Array(maxParticles);

const departed = new Uint8Array(maxParticles), lost = new Uint8Array(maxParticles);
const contactX = new Float32Array(maxParticles), contactY = new Float32Array(maxParticles);
const wallVX = new Float32Array(maxParticles), wallVY = new Float32Array(maxParticles);

const angles = new Float64Array(2), previousAngles = new Float64Array(2);
const cosines = new Float64Array(2), sines = new Float64Array(2);
const previousCosines = new Float64Array(2), previousSines = new Float64Array(2);

const counts = new Uint16Array(2), meanY = new Float64Array(2);
// Fixed linked-cell storage. No per-step Maps, objects or particle allocations.
const gridWidth = 100, gridHeight = 100, gridOffset = 300;
const heads = new Int32Array(gridWidth * gridHeight), next = new Int32Array(maxParticles);

let accumulator = 0, previousTime = performance.now(), fps = 60, frameCost = 0;
let substepBudget = 2, slowFrames = 0, fastFrames = 0;
let surfaceRestDensity = 0;
// Calibrate the 2D poly6 kernel against the initial hexagonal lattice.

canvas.addEventListener('pointerdown', e => {

  if (e.pointerId !== pointerId || !useDrag || state !== 'play') return;

  const dx = (e.clientX - pointerX) / screenScale(), dy = (e.clientY - pointerY) / screenScale();

canvas.addEventListener('lostpointercapture', () => { pointerId = null; });

$('inv').onclick = () => { direction *= -1; };

  try {
    if (audio) { audio.resume(); return; }

    const buffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const source = audio.createBufferSource(); source.buffer = buffer; source.loop = true;
    filter = audio.createBiquadFilter(); filter.type = 'bandpass'; filter.Q.value = 5;
    noiseGain = audio.createGain(); noiseGain.gain.value = 0;

  if (!audio) return;
  const oscillator = audio.createOscillator(), volume = audio.createGain();
  oscillator.frequency.value = ok ? 880 : 220; oscillator.type = ok ? 'sine' : 'triangle';
  volume.gain.setValueAtTime(.2, audio.currentTime);
  volume.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .5);

function show(html) { $('card').innerHTML = html; $('overlay').classList.remove('hide'); }
function hide() { $('overlay').classList.add('hide'); }
function goal() { return level === 1 ? '水 32% ±6%' : '先水 25%，再油 20%，各允许 ±6%'; }

  show('<h2>请拿稳手机</h2><p>竖着拿稳，正在测零点和抖动。</p><p class="small">没有传感器时自动进入手指模式</p>');

}
function finishCalibration() {
  if (!haveMotion && !haveOrientation) { useDrag = true; base = sigma = 0; alpha = .3; }
  else {
    let sx = 0, sy = 0, variance = 0;
    for (const angle of calibration) { sx += Math.cos(angle * Math.PI / 180); sy += Math.sin(angle * Math.PI / 180); }

function choose(k) {
  active = k; dragAngle = sm = theta = 0;
  for (const [i, id] of ['water', 'oil'].entries()) $(id).style.opacity = k === i ? '1' : '.55';
}
$('water').onclick = () => choose(0);
$('oil').onclick = () => choose(1);
function newCup() {
  total = particleCount * level; spilled = emitted = flow = accumulator = simulationTime = 0;
  oilStarted = false; waterFirst = true; phaseSteps = 0;
  alive.fill(0); departed.fill(0); lost.fill(0); vx.fill(0); vy.fill(0);
  angles.fill(0); previousAngles.fill(0); counts.fill(0); meanY.fill(0);
  accelerationX = accelerationY = dragForceX = dragForceY = 0;
  choose(0);
  for (let k = 0; k < level; k++) for (let row = 0; row < 30; row++) for (let col = 0; col < 19; col++) {
    const i = k * particleCount + row * 19 + col;
    x[i] = pivot(k) - 41.6 + col * spacing + (row % 2) * spacing * .5;
    y[i] = 310 - row * spacing * Math.sqrt(3) / 2;

  $('lv').textContent = '第 ' + level + ' 杯'; $('actions').hidden = false; $('oil').hidden = level === 1;

  show('<h2>第 ' + level + ' 关</h2><p>' + goal() + '</p><p>' +
    (useDrag ? '左右拖动调倾角，上下或来回快速拖动可晃出水花。' : '向右倾斜手机倒液，快速晃动会溅出。') +

  counts.fill(0); meanY.fill(0);
  for (let i = 0; i < total; i++) if (alive[i] && !lost[i]) {
    if (x[i] > cup.left + wallHalfWidth && x[i] < cup.right - wallHalfWidth &&

$('check').onclick = () => {
  updateCounts();
  const tooMuchSpill = spillFraction() > .1;
  const ok = !tooMuchSpill && Math.abs(counts[0] / capacity - (level === 1 ? .32 : .25)) <= .06 &&

  show('<h2>' + (tooMuchSpill ? '倒太猛，洒了' : ok ? '过关！' : '还差一点') + '</h2><p>' + goal() +
